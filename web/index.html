<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="课隙 CourseGap —— 离线优先的大学生课表与空档规划工具：课表管理、作业DDL、考试倒计时、课间空档分析、AI 自然语言助手。数据仅存本机。">
  <meta name="theme-color" content="#4f6df5">
  <title>课隙 CourseGap · 大学生课表与空档规划</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="24" rx="5" fill="var(--site-accent)"/><rect x="7" y="11" width="8" height="5" rx="1.5" fill="var(--site-on-accent)" opacity=".95"/><rect x="17" y="11" width="8" height="5" rx="1.5" fill="var(--site-on-accent)" opacity=".55"/><rect x="7" y="19" width="8" height="5" rx="1.5" fill="var(--site-on-accent)" opacity=".55"/><rect x="17" y="19" width="8" height="5" rx="1.5" fill="var(--site-on-accent)" opacity=".95"/><rect x="12" y="2" width="2.6" height="6" rx="1.3" fill="var(--site-accent)"/><rect x="17.4" y="2" width="2.6" height="6" rx="1.3" fill="var(--site-accent)"/></svg>
        <div class="brand-text">
          <h1>课隙 <span class="brand-en">CourseGap</span></h1>
          <p class="brand-sub">课表里的每段空档，都是可支配的时间</p>
        </div>
      </div>
      <div class="topbar-actions">
        <select id="schedule-switcher" class="input select" aria-label="切换课表"></select>
        <button id="theme-toggle" class="icon-btn" title="切换深浅色" aria-label="切换深浅色"></button>
      </div>
    </header>

    <nav class="mainnav" aria-label="主导航">
      <button class="nav-item" data-view="today"><span class="nav-ico" data-ico="sun"></span><span>今日</span></button>
      <button class="nav-item" data-view="timetable"><span class="nav-ico" data-ico="grid"></span><span>课表</span></button>
      <button class="nav-item" data-view="tasks"><span class="nav-ico" data-ico="check"></span><span>任务</span></button>
      <button class="nav-item" data-view="exams"><span class="nav-ico" data-ico="flag"></span><span>考试</span></button>
      <button class="nav-item" data-view="gaps"><span class="nav-ico" data-ico="gap"></span><span>空档</span></button>
      <button class="nav-item" data-view="assistant"><span class="nav-ico" data-ico="spark"></span><span>AI 助手</span></button>
      <button class="nav-item" data-view="settings"><span class="nav-ico" data-ico="gear"></span><span>设置</span></button>
    </nav>

    <main id="main" tabindex="-1">
      <section id="view-today" class="view" aria-label="今日"></section>
      <section id="view-timetable" class="view" aria-label="课表"></section>
      <section id="view-tasks" class="view" aria-label="任务"></section>
      <section id="view-exams" class="view" aria-label="考试"></section>
      <section id="view-gaps" class="view" aria-label="空档"></section>
      <section id="view-assistant" class="view" aria-label="AI 助手"></section>
      <section id="view-settings" class="view" aria-label="设置"></section>
    </main>

    <footer class="foot">
      <span>课隙 CourseGap · 数据仅保存在本机浏览器 · 原创开源项目（Mulan PSL v2）</span>
      <span id="foot-week"></span>
    </footer>
  </div>

  <div id="modal-root" aria-live="polite"></div>
  <div id="toast-root" aria-live="assertive"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
