<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>课序 · Google 授权</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f4f1e8;
        color: #1d2521;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(360px, 100%);
        padding: 24px;
        border-radius: 18px;
        background: #fffdf8;
        box-shadow: 0 18px 45px rgba(48, 45, 31, 0.1);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
        letter-spacing: 0.08em;
      }
      p {
        margin: 0;
        font-size: 13px;
        line-height: 1.7;
        color: #4d5a52;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #101613;
          color: #eee9dd;
        }
        main {
          background: #18211d;
        }
        p {
          color: #c1c8bf;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>课序 · Google 授权</h1>
      <p id="status">正在完成授权，请稍候…</p>
    </main>
    <script>
      (function () {
        var status = document.getElementById("status");
        var params = new URLSearchParams(window.location.search);
        var payload = {
          source: "kexu-google-oauth",
          code: params.get("code"),
          state: params.get("state"),
          error: params.get("error"),
          errorDescription: params.get("error_description"),
        };

        if (!window.opener) {
          status.textContent =
            "请从课序设置页发起授权。这个页面不能单独打开，也不会保存任何授权信息。";
          return;
        }

        window.opener.postMessage(payload, window.location.origin);

        if (payload.error) {
          status.textContent =
            "授权未完成：" + (payload.errorDescription || payload.error) + "。可以关闭此窗口。";
          return;
        }

        status.textContent = "授权完成，正在返回课序…";
        window.setTimeout(function () {
          window.close();
        }, 600);
      })();
    </script>
  </body>
</html>
